name: 问题反馈
description: 反馈连接、设置读写或页面问题
title: "[问题] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请描述已经发生的问题，不需要为反馈额外更改鼠标设置或刷固件。
        这里是公开的 GitHub Issue，请勿填写序列号、电脑用户名或其他个人信息。
  - type: input
    id: model
    attributes:
      label: 鼠标型号
      placeholder: 例如 G24 / G23 Pro，或不确定
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: 连接方式
      options:
        - USB 有线
        - 1K 接收器
        - 8K 接收器
        - 其他或不确定
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统和浏览器
      placeholder: 例如 Windows 11 / Chrome，或 macOS / Edge
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与实际结果
      description: 从打开页面开始，描述点击了什么、看到了什么。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或错误信息（可选）
      description: 可附页面截图，或复制错误文字；请先去掉个人信息。
