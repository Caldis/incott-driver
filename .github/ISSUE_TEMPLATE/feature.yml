name: 改进建议
description: 提出界面或使用流程的改进建议
title: "[建议] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 你想完成什么
      description: 描述使用场景，以及目前遇到的不便。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 希望怎样改进
    validations:
      required: true
